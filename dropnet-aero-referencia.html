<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropNet - referencia visual (Aero / Windows 7)</title>
<style>
  /* Fuente de verdad visual. Los datos y el fondo de escritorio son de mentira. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Segoe UI','Open Sans',Tahoma,sans-serif;font-size:12px;color:#000;
    padding:30px;display:flex;
    /* Fondo de escritorio de ejemplo: en la app real la ventana es transparente y se ve lo que haya debajo */
    background:
      radial-gradient(ellipse at 18% 25%,#6FD6EE 0%,rgba(111,214,238,0) 42%),
      radial-gradient(ellipse at 85% 80%,#3B7FE0 0%,rgba(59,127,224,0) 48%),
      radial-gradient(ellipse at 70% 15%,#8FE0B8 0%,rgba(143,224,184,0) 30%),
      linear-gradient(135deg,#0A3568,#1C7BA6 55%,#0B4A78);
  }
  button,select,input{font-family:inherit;font-size:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:1px dotted #1E395B;outline-offset:-3px}
  input::placeholder{color:#6F7F95}

  /* Ventana de vidrio */
  .win{
    position:relative;flex:1;min-width:0;min-height:560px;display:flex;flex-direction:column;
    padding:0 8px 8px;border-radius:8px;border:1px solid rgba(0,0,0,.6);
    background:rgba(170,200,232,.55);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.65);
  }
  .shine{position:absolute;inset:0;border-radius:8px;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.32) 0 22%,rgba(255,255,255,0) 22% 40%,rgba(255,255,255,.2) 40% 52%,rgba(255,255,255,0) 52%)}

  /* Barra de titulo */
  .titlebar{position:relative;flex:none;height:30px;display:flex;align-items:flex-start;justify-content:space-between}
  .title{display:flex;align-items:center;gap:7px;padding-top:7px;
    text-shadow:0 0 10px #fff,0 0 7px #fff,0 0 4px #fff}
  .wctrl{display:flex;margin-right:-2px;box-shadow:0 1px 3px rgba(0,0,0,.45);border-radius:0 0 4px 4px}
  .wbtn{height:19px;padding:0;border:1px solid rgba(0,0,0,.55);border-top:0;margin-left:-1px;cursor:default;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(rgba(255,255,255,.85),rgba(205,220,240,.55) 48%,rgba(150,175,210,.5) 52%,rgba(200,218,240,.75))}
  .wbtn:hover{background:linear-gradient(rgba(255,255,255,.95),rgba(225,238,255,.8) 48%,rgba(170,205,245,.7) 52%,rgba(215,235,255,.9))}
  .wmin{width:29px;border-radius:0 0 0 4px}
  .wmax{width:27px}
  .wclose{width:47px;border-radius:0 0 4px 0;background:linear-gradient(#EFA99B,#D2604A 48%,#BC3F27 52%,#E58369)}
  .wclose:hover{background:linear-gradient(#FFC2B4,#EE7A62 48%,#D9482E 52%,#FF9C80)}

  /* Area de cliente (opaca) */
  .client{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;
    border:1px solid rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(255,255,255,.5)}

  /* Barra de comandos */
  .cmdbar{flex:none;display:flex;align-items:center;gap:4px;padding:5px 8px;
    background:linear-gradient(#fff,#E9EEF6);border-bottom:1px solid #C5D0E0}
  .cmd{height:28px;padding:0 14px;border:1px solid transparent;border-radius:3px;background:transparent;color:#1E395B;cursor:default}
  .cmd:hover:not(:disabled){background:linear-gradient(#FDFEFF,#E3EDF9 50%,#D3E2F4 52%,#E2EDF9);border-color:#9FB6D3}
  .cmd:disabled{color:#8A97A8}
  .spacer{flex:1}
  .lbl{color:#1E395B;margin-right:2px}
  select{height:24px;color:#1E395B;border:1px solid #A9B8CC;border-radius:2px;background:#fff}
  .search{display:flex;align-items:center;gap:6px;width:190px;height:24px;margin-left:8px;padding:0 6px;
    background:#fff;border:1px solid #A9B8CC;border-radius:2px}
  .search input{flex:1;min-width:0;height:20px;padding:0;border:0;background:transparent;outline-offset:3px}

  /* Lista */
  :root{--cols:minmax(0,2.2fr) 70px 90px 100px 100px 130px}
  .head{flex:none;display:grid;grid-template-columns:var(--cols);padding:0 4px;
    background:linear-gradient(#fff,#F3F6FB);border-bottom:1px solid #DCE3EE;color:#3E5878}
  .head span{padding:5px 8px;border-right:1px solid #DCE3EE}
  .head span:last-child{border-right:0}
  .list{flex:1;min-height:0;overflow-y:auto;padding:2px 4px;background:#fff}
  .row{width:100%;display:grid;grid-template-columns:var(--cols);align-items:center;padding:3px 0;margin:0;
    border:1px solid transparent;border-radius:3px;background:#fff;text-align:left;color:#000;cursor:default}
  .row.sel{border-color:#7DA2CE;background:linear-gradient(#EAF4FE,#CFE4F9)}
  .row > span{padding:0 8px;min-width:0}
  .name{display:flex;align-items:center;gap:7px}
  .name b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state{display:flex;align-items:center;gap:6px}
  .empty{padding:24px 8px;color:#4A5A70}

  /* Panel de detalles */
  .detail{flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px 12px;
    background:linear-gradient(#F4F7FB,#E2E9F3);border-top:1px solid #C5D0E0;color:#3E5878}
  .detail .top{display:flex;align-items:center;gap:12px}
  .detail h2{margin:0;font-size:14px;font-weight:600;color:#1E395B}
  .detail .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmdline{padding:4px 8px;background:#fff;border:1px solid #B7C4D8;border-radius:2px;color:#1E395B;
    font-family:Consolas,'Lucida Console','DejaVu Sans Mono',monospace;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="win">
  <div class="shine"></div>

  <div class="titlebar">
    <div class="title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E4E8C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><path d="M3 3l18 18" stroke="#D2604A"/></svg>
      DropNet
    </div>
    <div class="wctrl">
      <button class="wbtn wmin" aria-label="Minimizar"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="6" width="7" height="2.4" fill="#fff" stroke="#2A3A52" stroke-width=".8"/></svg></button>
      <button class="wbtn wmax" aria-label="Maximizar"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="8" height="8" stroke="#2A3A52" stroke-width="2.6"/><rect x="1.5" y="1.5" width="8" height="8" stroke="#fff" stroke-width="1.2"/></svg></button>
      <button class="wbtn wclose" aria-label="Cerrar"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="#5A1A0E" stroke-width="3.2"/><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="#fff" stroke-width="1.8"/></svg></button>
    </div>
  </div>

  <div class="client">
    <div class="cmdbar">
      <button class="cmd" id="btnCut">Cortar internet</button>
      <button class="cmd" id="btnRestore">Restaurar</button>
      <button class="cmd" id="btnAll">Restaurar todo</button>
      <div class="spacer"></div>
      <label class="lbl" for="filter">Mostrar:</label>
      <select id="filter">
        <option value="all">Todos los procesos</option>
        <option value="net">Solo con red</option>
        <option value="blocked">Solo cortados</option>
      </select>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A6A94" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
        <input id="query" type="text" aria-label="Buscar procesos" placeholder="Buscar procesos">
      </div>
    </div>

    <div class="head">
      <span>Nombre de imagen</span><span>PID</span><span>Conexiones</span><span>Bajada</span><span>Subida</span><span>Estado</span>
    </div>
    <div class="list" id="list"></div>

    <div class="detail">
      <div id="detailTop"></div>
      <div class="cmdline" id="cmdline"></div>
      <div class="foot"><span id="stats"></span><span>Ejecutando como administrador</span></div>
    </div>
  </div>
</div>

<script>
  // Datos de ejemplo. En la app real vienen del backend (procesos con conexiones de red).
  const PROCS = [
    { id:'p1', name:'mi-proyecto.exe', path:'C:\\dev\\mi-proyecto\\target\\debug\\mi-proyecto.exe', pid:14872, conns:3, down:'12 KB/s', up:'4 KB/s' },
    { id:'p2', name:'node.exe', path:'C:\\Program Files\\nodejs\\node.exe', pid:9120, conns:8, down:'210 KB/s', up:'38 KB/s' },
    { id:'p3', name:'php.exe', path:'C:\\xampp\\php\\php.exe', pid:6044, conns:2, down:'3 KB/s', up:'1 KB/s' },
    { id:'p4', name:'python.exe', path:'C:\\Python312\\python.exe', pid:11308, conns:4, down:'48 KB/s', up:'9 KB/s' },
    { id:'p5', name:'chrome.exe', path:'C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe', pid:2210, conns:22, down:'4.8 MB/s', up:'320 KB/s' },
    { id:'p6', name:'Code.exe', path:'C:\\Users\\dev\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe', pid:7764, conns:6, down:'84 KB/s', up:'22 KB/s' },
    { id:'p7', name:'Discord.exe', path:'C:\\Users\\dev\\AppData\\Local\\Discord\\app-1.0.9\\Discord.exe', pid:5532, conns:5, down:'36 KB/s', up:'11 KB/s' },
    { id:'p8', name:'Steam.exe', path:'C:\\Program Files (x86)\\Steam\\steam.exe', pid:3980, conns:9, down:'1.2 MB/s', up:'64 KB/s' },
    { id:'p9', name:'WindowsTerminal.exe', path:'C:\\Program Files\\WindowsApps\\Microsoft.WindowsTerminal\\WindowsTerminal.exe', pid:8416, conns:0, down:'0 KB/s', up:'0 KB/s' }
  ];

  const state = {
    filter:'all', query:'', sel:'p2', blocked:{ p1:true },
    lastCmd:'New-NetFirewallRule -DisplayName "DropNet_mi-proyecto.exe" -Direction Outbound -Program "C:\\dev\\mi-proyecto\\target\\debug\\mi-proyecto.exe" -Action Block'
  };

  const ICON_APP = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="#fff" stroke="#5B7699"/><rect x="2" y="3" width="12" height="3" fill="#6C9BD2"/></svg>';
  const ICON_BLOCKED = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex:none"><circle cx="7" cy="7" r="6" fill="#D2402B" stroke="#8F2415"/><path d="M4.5 4.5l5 5M9.5 4.5l-5 5" stroke="#fff" stroke-width="1.6"/></svg>';
  const ICON_OK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex:none"><circle cx="7" cy="7" r="6" fill="#3FA02A" stroke="#26701A"/><path d="M4 7.2l2 2 4-4.2" fill="none" stroke="#fff" stroke-width="1.6"/></svg>';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function setBlock(p, on){
    if(!p) return;
    if(on){
      state.blocked[p.id] = true;
      state.lastCmd = 'New-NetFirewallRule -DisplayName "DropNet_'+p.name+'" -Direction Outbound -Program "'+p.path+'" -Action Block';
    } else {
      delete state.blocked[p.id];
      state.lastCmd = 'Remove-NetFirewallRule -DisplayName "DropNet_'+p.name+'"';
    }
    render();
  }

  function render(){
    const q = state.query.trim().toLowerCase();
    const sel = PROCS.find(p => p.id === state.sel);
    const selBlocked = !!(sel && state.blocked[sel.id]);
    const blockedCount = Object.keys(state.blocked).length;
    const online = PROCS.filter(p => p.conns > 0 && !state.blocked[p.id]).length;

    const rows = PROCS
      .filter(p => !q || p.name.toLowerCase().includes(q))
      .filter(p => state.filter === 'all' || (state.filter === 'net' && p.conns > 0) || (state.filter === 'blocked' && state.blocked[p.id]));

    $('list').innerHTML = rows.length ? rows.map(p => {
      const b = !!state.blocked[p.id];
      return '<button class="row'+(state.sel === p.id ? ' sel' : '')+'" data-id="'+p.id+'" aria-pressed="'+(state.sel === p.id)+'">'
        + '<span class="name">'+ICON_APP+'<b>'+esc(p.name)+'</b></span>'
        + '<span>'+p.pid+'</span>'
        + '<span>'+(b ? 0 : p.conns)+'</span>'
        + '<span>'+(b ? '0 KB/s' : p.down)+'</span>'
        + '<span>'+(b ? '0 KB/s' : p.up)+'</span>'
        + '<span class="state">'+(b ? ICON_BLOCKED+'Bloqueado' : ICON_OK+'Permitido')+'</span>'
        + '</button>';
    }).join('') : '<div class="empty">No hay procesos que coincidan con el filtro.</div>';

    $('detailTop').innerHTML = sel
      ? '<div class="top"><svg width="32" height="32" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="#fff" stroke="#5B7699"/><rect x="2" y="3" width="12" height="3" fill="#6C9BD2"/></svg>'
        + '<div style="min-width:0"><h2>'+esc(sel.name)+'</h2><div class="path">'+esc(sel.path)+'</div></div>'
        + '<div style="flex:1"></div><span>PID '+sel.pid+' · '+(selBlocked ? 'Sin internet' : 'Con acceso')+'</span></div>'
      : 'Selecciona un proceso para ver sus detalles.';

    $('cmdline').textContent = state.lastCmd;
    $('stats').textContent = 'Procesos con red: '+online+' · Cortados: '+blockedCount;
    $('btnCut').disabled = !sel || selBlocked;
    $('btnRestore').disabled = !sel || !selBlocked;
    $('btnAll').disabled = blockedCount === 0;
  }

  $('list').addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if(row){ state.sel = row.dataset.id; render(); }
  });
  $('btnCut').addEventListener('click', () => setBlock(PROCS.find(p => p.id === state.sel), true));
  $('btnRestore').addEventListener('click', () => setBlock(PROCS.find(p => p.id === state.sel), false));
  $('btnAll').addEventListener('click', () => {
    state.blocked = {};
    state.lastCmd = 'Get-NetFirewallRule -DisplayName "DropNet_*" | Remove-NetFirewallRule';
    render();
  });
  $('filter').addEventListener('change', (e) => { state.filter = e.target.value; render(); });
  $('query').addEventListener('input', (e) => { state.query = e.target.value; render(); });

  render();
</script>
</body>
</html>
